name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    # pwsh is preinstalled here, and release.ps1 has nothing Windows specific in it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches info.json version
        shell: pwsh
        run: |
          $version = (Get-Content info.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'
          if ($version -ne $tag) { throw "Tag $tag does not match info.json version $version" }

      - name: Build
        shell: pwsh
        run: ./release.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' (Get-Item build/*.zip).FullName --generate-notes
