name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    # pwsh is preinstalled here, and release.ps1 has nothing Windows specific in it.
    runs-on: ubuntu-latest
    # Job level, because a step cannot read the secrets context from its own if.
    env:
      FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
      # Taken from the repository instead of spelled out, so renaming the default branch does not break releases.
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          # release.ps1 looks up the previous release among the tags, which a shallow clone lacks.
          fetch-depth: 0

      - name: Check the tag is on top of the default branch
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            echo "Tag $GITHUB_REF_NAME is not the tip of $DEFAULT_BRANCH, so the changelog commit has nowhere to go" >&2
            exit 1
          fi

      - name: Stamp the version into the changelog
        shell: pwsh
        run: |
          # The placeholder entry collects everything written since the last release.
          $changelog = Get-Content changelog.txt -Raw
          if ($changelog -notmatch '(?m)^Version: 0\.0\.0\r?$') { throw "No 0.0.0 placeholder at the top of changelog.txt" }
          $stamped = "Version: $env:GITHUB_REF_NAME`nDate: $(Get-Date -Format 'yyyy-MM-dd')"
          $changelog -replace '(?m)^Version: 0\.0\.0\r?$', $stamped | Set-Content changelog.txt -NoNewline

      # release.ps1 stamps the version into info.json too, from GITHUB_REF_NAME.
      - name: Build
        shell: pwsh
        run: ./release.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes are the changelog entry just stamped, turned into markdown.
          $entry = ((Get-Content changelog.txt -Raw) -split '(?m)^-{99}\r?$' |
              Where-Object { $_.Trim() } | Select-Object -First 1).Trim() -split '\r?\n' |
              Where-Object { $_ -notmatch '^(Version|Date):' } |
              ForEach-Object { $_ -replace '^  (\S.*):$', '### $1' -replace '^    - ', '- ' }
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md' # kept out of the repo, it gets committed later
          Set-Content $notes ($entry -join "`n")

          gh release create "$env:GITHUB_REF_NAME" (Get-Item build/*.zip).FullName --notes-file $notes

      # The mod page itself is created by hand; this only adds a release to it.
      - name: Upload to the mod portal
        if: ${{ env.FACTORIO_API_KEY != '' }}
        shell: pwsh
        run: |
          $zip = (Get-Item build/*.zip).FullName
          $headers = @{ Authorization = "Bearer $env:FACTORIO_API_KEY" }

          $init = Invoke-RestMethod -Method Post -Headers $headers `
              -Uri 'https://mods.factorio.com/api/v2/mods/releases/init_upload' `
              -Form @{ mod = (Get-Content info.json -Raw | ConvertFrom-Json).name }

          Invoke-RestMethod -Method Post -Headers $headers -Uri $init.upload_url `
              -Form @{ file = Get-Item $zip } | Out-Null

      # Overwrites the portal description on every release, so edits made on the portal itself are lost.
      - name: Sync the mod portal description
        if: ${{ env.FACTORIO_API_KEY != '' }}
        shell: pwsh
        run: |
          $info = Get-Content info.json -Raw | ConvertFrom-Json
          Invoke-RestMethod -Method Post -Headers @{ Authorization = "Bearer $env:FACTORIO_API_KEY" } `
              -Uri 'https://mods.factorio.com/api/v2/mods/edit_details' `
              -Form @{
                  mod = $info.name
                  summary = $info.description
                  description = (Get-Content README.md -Raw)
                  source_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
              } | Out-Null

      # The tag itself still holds the placeholder: it was written before this ran.
      - name: Commit the changelog and reopen it for the next release
        shell: pwsh
        run: |
          $separator = '-' * 99
          $placeholder = "$separator`nVersion: 0.0.0`n  Changes:`n    - Nothing yet`n"
          Set-Content changelog.txt ($placeholder + (Get-Content changelog.txt -Raw)) -NoNewline

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release $env:GITHUB_REF_NAME"
          git push origin "HEAD:$env:DEFAULT_BRANCH"
