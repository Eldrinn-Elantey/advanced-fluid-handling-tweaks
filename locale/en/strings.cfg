[item-name]
aft-generated-valve=Advanced Fluid Handling valve (compatibility patch)

[item-description]
aft-generated-valve=Placeholder item generated by Advanced Fluid Handling Tweaks so that valve entities with a missing item prototype can still be built and mined.

[mod-name]
advanced-fluid-handling-tweaks=Advanced Fluid Handling Tweaks

[mod-setting-name]
aft-separate-underground-tiers=Underground pipes connect within their own tier only
aft-recipe-simplification=Simplify Advanced Fluid Handling recipes

[mod-setting-description]
aft-separate-underground-tiers=Underground pipes of different tiers stop connecting to each other, the way vanilla underground belts behave. On an existing save this splits every fluid network where two tiers currently meet.
aft-recipe-simplification=Underground pipe and mini pump recipes take regular pipes instead of tiered segments and couplers. A segment counts as one, two or three pipes depending on its tier.\nFewer intermediates keeps the swivel joint and the small pipe coupler.\nPipes only replaces them too: a swivel joint costs two pipes, a coupler one.

[string-mod-setting]
aft-recipe-simplification-off=Off
aft-recipe-simplification-fewer-intermediates=Fewer intermediates
aft-recipe-simplification-pipes-only=Pipes only
