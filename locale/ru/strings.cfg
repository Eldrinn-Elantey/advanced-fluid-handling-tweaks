[item-name]
aft-generated-valve=Клапан Advanced Fluid Handling (патч совместимости)

[item-description]
aft-generated-valve=Предмет-заглушка, созданный модом Advanced Fluid Handling Tweaks, чтобы клапаны с отсутствующим прототипом предмета можно было ставить и разбирать.

[mod-name]
advanced-fluid-handling-tweaks=Advanced Fluid Handling Tweaks

[mod-setting-name]
aft-separate-underground-tiers=Подземные трубы соединяются только в пределах своего тира
aft-recipe-simplification=Упрощённые рецепты Advanced Fluid Handling

[mod-setting-description]
aft-separate-underground-tiers=Подземные трубы разных тиров перестают соединяться друг с другом, как это работает у ванильных подземных конвейеров. На существующем сохранении это разорвёт жидкостные сети во всех местах, где сейчас стыкуются разные тиры.
aft-recipe-simplification=Рецепты подземных труб и мини-насосов используют обычные трубы вместо сегментов и соединителей разных тиров. Сегмент считается за одну, две или три трубы в зависимости от тира.\nВ режиме «Меньше полуфабрикатов» остаются поворотный шарнир и малый соединитель труб.\nВ режиме «Только трубы» трубы заменяют и их: шарнир стоит две трубы, соединитель одну.

[string-mod-setting]
aft-recipe-simplification-off=Выключено
aft-recipe-simplification-fewer-intermediates=Меньше полуфабрикатов
aft-recipe-simplification-pipes-only=Только трубы
